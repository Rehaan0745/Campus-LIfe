<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Campus Life Archive</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>


<style>

:root {
    --teal:#017069;
    --dark-teal:#005B56;
    --deep:#073f3c;

    --cream:#F1E1CA;
    --paper:#FAF4EA;

    --gold:#D9A441;
    --coral:#D97955;

    --white:#FFFFFF;

    --text:#173b38;
    --muted:#71817d;

    --border:rgba(7,63,60,.12);
}

* {
    box-sizing:border-box;
}

body {
    margin:0;

    background:
        radial-gradient(
            circle at top right,
            rgba(217,164,65,.10),
            transparent 30%
        ),
        var(--paper);

    color:var(--text);

    font-family:"DM Sans",sans-serif;
}


/* NAV */

.navbar {

    height:76px;

    padding:0 6vw;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:rgba(250,244,234,.95);

    border-bottom:1px solid var(--border);

    position:sticky;

    top:0;

    z-index:20;

    backdrop-filter:blur(14px);

}

.brand {

    display:flex;

    align-items:center;

    gap:13px;

}

.logo {

    width:52px;

    height:52px;

    border-radius:50%;

    background:white;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    box-shadow:
        0 8px 22px rgba(7,63,60,.12);

}

.logo img {

    width:100%;

    height:100%;

    object-fit:contain;

}

.brand-title {

    font-family:"Manrope",sans-serif;

    font-weight:800;

    color:var(--deep);

}

.back {

    color:var(--teal);

    text-decoration:none;

    font-size:13px;

    font-weight:700;

}


/* HERO */

.hero {

    max-width:1200px;

    margin:auto;

    padding:
        70px 6vw
        45px;

    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:25px;

}

.eyebrow {

    text-transform:uppercase;

    letter-spacing:2px;

    font-size:11px;

    font-weight:800;

    color:var(--teal);

    margin-bottom:12px;

}

h1 {

    margin:0;

    font-family:"Manrope",sans-serif;

    color:var(--deep);

    font-size:
        clamp(42px,7vw,70px);

    line-height:.95;

    letter-spacing:-3px;

}

.subtitle {

    margin-top:16px;

    color:var(--muted);

}


/* ADD EVENT */

.add-event {

    border:none;

    background:var(--teal);

    color:white;

    padding:13px 18px;

    border-radius:13px;

    font-family:inherit;

    font-weight:700;

    cursor:pointer;

    display:flex;

    gap:8px;

    align-items:center;

}

.add-event:hover {

    background:var(--dark-teal);

}

.plus {

    font-size:19px;

}


/* CONTENT */

.content {

    max-width:1200px;

    margin:auto;

    padding:
        10px 6vw
        80px;

}

.events {

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px,1fr)
        );

    gap:20px;

}


/* EVENT CARD */

.event-card {

    background:white;

    border:1px solid var(--border);

    border-radius:22px;

    padding:27px;

    min-height:220px;

    box-shadow:
        0 15px 40px rgba(7,63,60,.08);

    display:flex;

    flex-direction:column;

    transition:.25s ease;

}

.event-card:hover {

    transform:translateY(-5px);

    box-shadow:
        0 22px 50px rgba(7,63,60,.14);

}

.event-date {

    color:var(--coral);

    text-transform:uppercase;

    letter-spacing:1.2px;

    font-size:11px;

    font-weight:800;

}

.event-title {

    margin-top:13px;

    font-family:"Manrope",sans-serif;

    font-size:23px;

    font-weight:800;

    color:var(--deep);

}

.read-story {

    margin-top:auto;

    padding-top:30px;

    color:var(--teal);

    text-decoration:none;

    font-size:14px;

    font-weight:800;

}

.read-story:hover {

    text-decoration:underline;

}


/* LOADING */

.loading {

    text-align:center;

    padding:50px 0;

    color:var(--muted);

}


/* MODAL */

.modal-overlay {

    position:fixed;

    inset:0;

    background:
        rgba(7,63,60,.45);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:100;

    backdrop-filter:blur(8px);

}

.modal-overlay.active {

    display:flex;

}

.modal {

    width:min(470px,100%);

    background:var(--paper);

    border-radius:24px;

    padding:30px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.2);

}

.modal-header {

    display:flex;

    justify-content:space-between;

    gap:20px;

    margin-bottom:25px;

}

.modal-title {

    margin:0;

    font-family:"Manrope",sans-serif;

    font-size:24px;

    color:var(--deep);

}

.modal-description {

    margin:7px 0 0;

    font-size:13px;

    line-height:1.5;

    color:var(--muted);

}

.close-btn {

    border:none;

    width:34px;

    height:34px;

    border-radius:50%;

    background:white;

    font-size:20px;

    cursor:pointer;

}

.form-group {

    margin-bottom:18px;

}

label {

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

}

input {

    width:100%;

    border:1px solid var(--border);

    border-radius:12px;

    padding:13px;

    background:white;

    font-family:inherit;

    outline:none;

}

input:focus {

    border-color:var(--teal);

    box-shadow:
        0 0 0 3px rgba(1,112,105,.1);

}

.actions {

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:25px;

}

.cancel,
.submit {

    border:none;

    padding:12px 18px;

    border-radius:12px;

    font-family:inherit;

    font-weight:700;

    cursor:pointer;

}

.cancel {

    background:white;

    border:1px solid var(--border);

}

.submit {

    background:var(--teal);

    color:white;

}

.status {

    display:none;

    padding:12px;

    border-radius:12px;

    margin-top:14px;

    font-size:13px;

}

.status.show {

    display:block;

}

.status.success {

    background:#e4f5ee;

    color:#17624d;

}

.status.error {

    background:#fbe8e5;

    color:#8c3027;

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="brand">

        <div class="logo">

            <img
                src="../gitam-logo.png"
                alt="GITAM"
            >

        </div>

        <div class="brand-title">
            Campus Life
        </div>

    </div>


    <a
        class="back"
        href="../index.html"
    >
        ← All Months
    </a>

</nav>


<!-- HERO -->

<section class="hero">

    <div>

        <div class="eyebrow">
            Campus Life Archive
        </div>

        <h1 id="monthTitle">
            Loading...
        </h1>

        <div
            class="subtitle"
            id="monthSubtitle"
        >
            Stories and events from GITAM
        </div>

    </div>


    <button
        class="add-event"
        onclick="openEventModal()"
    >

        <span class="plus">
            ＋
        </span>

        Add Event

    </button>

</section>


<!-- EVENTS -->

<main class="content">

    <div
        id="events"
        class="events"
    >

        <div class="loading">
            Loading events...
        </div>

    </div>

</main>


<!-- MODAL -->

<div
    id="eventModal"
    class="modal-overlay"
    onclick="closeOutside(event)"
>

    <div class="modal">

        <div class="modal-header">

            <div>

                <h3 class="modal-title">
                    Add Event
                </h3>

                <p class="modal-description">
                    Create a new event page inside
                    this month.
                </p>

            </div>


            <button
                class="close-btn"
                onclick="closeEventModal()"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label>
                Event name
            </label>

            <input
                id="eventName"
                type="text"
                placeholder="AI & Robotics Workshop"
            >

        </div>


        <div class="form-group">

            <label>
                Event date
            </label>

            <input
                id="eventDate"
                type="date"
            >

        </div>


        <div class="form-group">

            <label>
                GitHub Personal Access Token
            </label>

            <input
                id="eventToken"
                type="password"
                placeholder="github_pat_..."
                autocomplete="off"
            >

        </div>


        <div
            id="eventStatus"
            class="status"
        ></div>


        <div class="actions">

            <button
                class="cancel"
                onclick="closeEventModal()"
            >
                Cancel
            </button>

            <button
                id="eventSubmit"
                class="submit"
                onclick="createEvent()"
            >
                Create Event
            </button>

        </div>

    </div>

</div>


<script>


/* =========================================================
   AUTOMATICALLY DETECT REPOSITORY + MONTH
========================================================= */

const pathParts =
    window.location.pathname
        .split("/")
        .filter(Boolean);


const owner =
    window.location.hostname
        .split(".")[0];


const repo =
    pathParts[0];


let monthFolder;


const lastPart =
    pathParts[pathParts.length - 1];


if (
    lastPart &&
    lastPart.toLowerCase() === "index.html"
) {

    monthFolder =
        pathParts[pathParts.length - 2];

}
else {

    monthFolder =
        pathParts[pathParts.length - 1];

}


/* =========================================================
   MONTH TITLE
========================================================= */

document.getElementById(
    "monthTitle"
).textContent = monthFolder;


document.getElementById(
    "monthSubtitle"
).textContent =
    "Stories and events from GITAM";


/* =========================================================
   LOAD EVENTS
========================================================= */

async function loadEvents() {

    const container =
        document.getElementById("events");


    try {

        const response =
            await fetch(
                `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(monthFolder)}`
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load events."
            );

        }


        const files =
            await response.json();


        const eventFiles =
            files.filter(file =>

                file.type === "file" &&

                file.name
                    .toLowerCase()
                    .endsWith(".html") &&

                file.name
                    .toLowerCase() !== "index.html"

            );


        if (!eventFiles.length) {

            container.innerHTML = `
                <div class="loading">
                    No events added yet.
                </div>
            `;

            return;

        }


        const events = [];


        for (
            const file of eventFiles
        ) {

            let eventDate = null;


            try {

                const html =
                    await fetch(
                        file.download_url
                    ).then(
                        r => r.text()
                    );


                const doc =
                    new DOMParser()
                        .parseFromString(
                            html,
                            "text/html"
                        );


                const meta =
                    doc.querySelector(
                        'meta[name="event-date"]'
                    );


                if (meta) {

                    eventDate =
                        meta.content;

                }

            }
            catch(error) {

                console.warn(
                    file.name,
                    error
                );

            }


            events.push({
                file,
                eventDate
            });

        }


        events.sort((a,b) => {

            if (!a.eventDate) return 1;

            if (!b.eventDate) return -1;

            return new Date(a.eventDate)
                - new Date(b.eventDate);

        });


        container.innerHTML = "";


        events.forEach(event => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "event-card";


            card.innerHTML = `

                <div class="event-date">
                    ${
                        event.eventDate
                            ? formatDate(
                                event.eventDate
                              )
                            : "Date not specified"
                    }
                </div>

                <div class="event-title">
                    ${
                        prettifyFilename(
                            event.file.name
                        )
                    }
                </div>

                <a
                    class="read-story"
                    href="${event.file.name}"
                >
                    Read story →
                </a>

            `;


            container.appendChild(card);

        });

    }
    catch(error) {

        console.error(error);

        container.innerHTML = `
            <div class="loading">
                Unable to load events.
            </div>
        `;

    }

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value) {

    return new Date(
        value + "T00:00:00"
    ).toLocaleDateString(
        "en-IN",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =========================================================
   TITLE
========================================================= */

function prettifyFilename(
    filename
) {

    return filename
        .replace(/\.html$/i,"")
        .replace(/[-_]+/g," ")
        .replace(/\b\w/g,
            c => c.toUpperCase()
        );

}


/* =========================================================
   MODAL
========================================================= */

function openEventModal() {

    document
        .getElementById("eventModal")
        .classList.add("active");

}


function closeEventModal() {

    document
        .getElementById("eventModal")
        .classList.remove("active");

}


function closeOutside(event) {

    if (
        event.target.id === "eventModal"
    ) {

        closeEventModal();

    }

}


function showStatus(
    message,
    type
) {

    const status =
        document.getElementById(
            "eventStatus"
        );

    status.textContent =
        message;

    status.className =
        `status show ${type}`;

}


/* =========================================================
   SLUG
========================================================= */

function createSlug(name) {

    return name
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");

}


/* =========================================================
   CREATE EVENT
========================================================= */

async function createEvent() {

    const name =
        document.getElementById(
            "eventName"
        ).value.trim();


    const date =
        document.getElementById(
            "eventDate"
        ).value;


    const token =
        document.getElementById(
            "eventToken"
        ).value.trim();


    if (!name || !date || !token) {

        showStatus(
            "Please fill in all fields.",
            "error"
        );

        return;

    }


    const filename =
        `${createSlug(name)}.html`;


    const path =
        `${monthFolder}/${filename}`;


    const button =
        document.getElementById(
            "eventSubmit"
        );


    button.disabled = true;

    button.textContent =
        "Creating...";


    try {

        const check =
            await githubRequest(
                `contents/${path}`,
                token,
                "GET"
            );


        if (check.ok) {

            throw new Error(
                `${filename} already exists.`
            );

        }


        const html =
            createEventHTML(
                name,
                date
            );


        const response =
            await githubRequest(
                `contents/${path}`,
                token,
                "PUT",
                {

                    message:
                        `Add event: ${name}`,

                    content:
                        btoa(
                            unescape(
                                encodeURIComponent(
                                    html
                                )
                            )
                        ),

                    branch:"main"

                }
            );


        if (!response.ok) {

            const data =
                await response.json();

            throw new Error(
                data.message ||
                "Unable to create event."
            );

        }


        showStatus(
            "Event created successfully.",
            "success"
        );


        setTimeout(() => {

            closeEventModal();

            loadEvents();

        },1500);

    }
    catch(error) {

        showStatus(
            error.message,
            "error"
        );

    }
    finally {

        button.disabled = false;

        button.textContent =
            "Create Event";

    }

}


/* =========================================================
   GITHUB
========================================================= */

async function githubRequest(
    endpoint,
    token,
    method,
    body = null
) {

    return fetch(
        `https://api.github.com/repos/${owner}/${repo}/${endpoint}`,
        {

            method,

            headers: {

                "Authorization":
                    `Bearer ${token}`,

                "Accept":
                    "application/vnd.github+json",

                "X-GitHub-Api-Version":
                    "2022-11-28"

            },

            body:
                body
                    ? JSON.stringify(body)
                    : null

        }
    );

}


/* =========================================================
   EVENT TEMPLATE
========================================================= */

function createEventHTML(
    name,
    date
) {

    const displayDate =
        new Date(
            date + "T00:00:00"
        ).toLocaleDateString(
            "en-IN",
            {
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );


    return `<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
${name} | Campus Life Chronicle
</title>

<meta
    name="event-date"
    content="${date}"
>

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#F8F4F0;
    color:#202020;
}

.navbar {
    padding:18px 7%;
    background:white;
    border-bottom:1px solid #E8E3DF;
}

.logo {
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
}

.logo img {
    width:100%;
    height:100%;
    object-fit:contain;
}

.hero {
    padding:90px 8%;
    background:#7A1E2D;
    color:white;
}

.hero h1 {
    font-size:clamp(42px,7vw,78px);
    margin:0;
}

.hero p {
    margin-top:20px;
    opacity:.9;
}

.article {
    max-width:900px;
    margin:auto;
    background:white;
    padding:60px 7%;
    min-height:500px;
}

.article h2 {
    color:#7A1E2D;
}

.article p {
    line-height:1.8;
    color:#555;
}

.info {
    padding:20px;
    margin-top:30px;
    background:#F8F4F0;
    border-left:4px solid #7A1E2D;
}

footer {
    text-align:center;
    padding:30px;
    color:#6F6F6F;
}

</style>

</head>

<body>

<nav class="navbar">

    <div class="logo">

        <img
            src="../gitam-logo.png"
            alt="GITAM"
        >

    </div>

</nav>

<section class="hero">

    <h1>
        ${name}
    </h1>

    <p>
        ${displayDate}
    </p>

</section>

<main class="article">

    <h2>
        About the Event
    </h2>

    <p>
        Write your event story here.
    </p>


    <div class="info">

        <strong>
            Event Date:
        </strong>

        ${displayDate}

    </div>


    <h2>
        Highlights
    </h2>

    <p>
        Add event highlights, photographs,
        speakers, activities and outcomes here.
    </p>

</main>

<footer>

    Campus Life Chronicle · GITAM University

</footer>

</body>

</html>`;

}


/* =========================================================
   INITIAL LOAD
========================================================= */

loadEvents();

</script>

</body>

</html>
