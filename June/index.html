<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GITAM | Monthly Newsletter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --teal:#017069;
    --dark:#073f3c;
    --cream:#f1e1ca;
    --paper:#faf4ea;
    --gold:#d9a441;
    --coral:#d97955;
    --muted:#6c7774;
    --white:#fff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    color:var(--dark);
    font-family:'DM Sans',sans-serif;
    background:
        radial-gradient(
            circle at 8% 5%,
            rgba(217,164,65,.18),
            transparent 24%
        ),
        radial-gradient(
            circle at 92% 15%,
            rgba(1,112,105,.12),
            transparent 25%
        ),
        var(--paper);
}

.wrap{
    max-width:1120px;
    margin:auto;
    padding:0 24px;
}

/* HEADER */

header{
    padding:22px 0;
}

.nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--dark);
    text-decoration:none;
    font-size:13px;
    font-weight:800;
    letter-spacing:.08em;
}

/* GITAM LOGO */

.logo{
    width:52px;
    height:52px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffffff;
    overflow:hidden;
    box-shadow:0 8px 22px rgba(7,63,60,.12);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* DASHBOARD BUTTON */

.back{
    padding:10px 16px;
    border:1px solid rgba(1,112,105,.15);
    border-radius:999px;
    color:var(--dark);
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    background:rgba(255,255,255,.8);
    transition:.2s;
}

.back:hover{
    background:#fff;
    transform:translateY(-2px);
}

/* HERO */

.hero{
    text-align:center;
    padding:68px 0 45px;
}

.eyebrow{
    display:inline-block;
    padding:8px 13px;
    border-radius:999px;
    background:rgba(217,164,65,.17);
    color:#795a18;
    font-size:11px;
    font-weight:800;
    letter-spacing:.13em;
    text-transform:uppercase;
}

h1{
    margin:17px 0 10px;
    font-family:Manrope,sans-serif;
    font-size:clamp(45px,7vw,76px);
    line-height:.98;
    letter-spacing:-.055em;
    color:var(--dark);
}

.intro{
    max-width:650px;
    margin:auto;
    color:var(--muted);
    line-height:1.7;
    font-size:15px;
}

/* DIVIDER */

.rule{
    height:1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(1,112,105,.22),
            transparent
        );
    margin-bottom:32px;
}

/* STORIES HEADER */

.status{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.status h2{
    margin:0;
    font:700 20px Manrope,sans-serif;
}

.count{
    padding:7px 11px;
    border-radius:999px;
    background:rgba(1,112,105,.09);
    color:var(--teal);
    font-size:12px;
    font-weight:700;
}

/* EVENT GRID */

.events{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    padding-bottom:70px;
}

/* EVENT CARD */

.card{
    position:relative;
    min-height:235px;
    padding:25px;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    background:rgba(255,255,255,.88);
    border:1px solid rgba(1,112,105,.1);
    border-radius:22px;
    box-shadow:0 16px 40px rgba(7,63,60,.1);
    overflow:hidden;
    transition:.22s;
}

.card:after{
    content:'';
    position:absolute;
    right:-30px;
    top:-30px;
    width:95px;
    height:95px;
    border-radius:50%;
    background:rgba(217,164,65,.14);
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(1,112,105,.28);
    box-shadow:0 22px 48px rgba(7,63,60,.15);
}

.number{
    color:var(--coral);
    font-size:12px;
    font-weight:800;
    letter-spacing:.12em;
}

/* EVENT DATE */

.date{
    margin-top:12px;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
}

/* EVENT TITLE */

.title{
    margin:30px 0 12px;
    font:700 23px/1.18 Manrope,sans-serif;
}

/* READ STORY */

.open{
    margin-top:auto;
    color:var(--teal);
    font-size:13px;
    font-weight:800;
}

/* STATES */

.empty,
.error{
    grid-column:1/-1;
    text-align:center;
    padding:42px;
    border:1px dashed rgba(1,112,105,.25);
    border-radius:22px;
    color:var(--muted);
    background:rgba(255,255,255,.7);
}

/* FOOTER */

footer{
    border-top:1px solid rgba(1,112,105,.12);
    padding:22px 0 32px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

/* TABLET */

@media(max-width:800px){

    .events{
        grid-template-columns:repeat(2,1fr);
    }

}

/* MOBILE */

@media(max-width:560px){

    .wrap{
        padding:0 17px;
    }

    .hero{
        padding:50px 0 35px;
    }

    .events{
        grid-template-columns:1fr;
    }

    .brand{
        font-size:11px;
    }

    .logo{
        width:45px;
        height:45px;
    }

    .back{
        padding:9px 12px;
    }

}
</style>
</head>

<body>

<header>

    <div class="wrap nav">

        <!-- GITAM LOGO -->
        <a class="brand" href="../index.html">

            <div class="logo">
                <img src="../gitam-logo.png" alt="GITAM">
            </div>

            <span>GITAM · CAMPUS CHRONICLE</span>

        </a>

        <!-- BACK TO DASHBOARD -->
        <a class="back" href="../index.html">
            ← Dashboard
        </a>

    </div>

</header>


<main class="wrap">

    <!-- HERO -->

    <section class="hero">

        <span class="eyebrow">
            Campus Newsletter
        </span>

        <h1 id="monthTitle">
            Month
        </h1>

        <p class="intro">
            Explore the events, initiatives and stories featured
            in this month's GITAM campus newsletter.
        </p>

    </section>


    <div class="rule"></div>


    <!-- STORIES HEADER -->

    <div class="status">

        <h2>
            Stories &amp; Events
        </h2>

        <span class="count" id="count">
            Loading…
        </span>

    </div>


    <!-- EVENTS WILL LOAD AUTOMATICALLY -->

    <section class="events" id="events">

        <div class="empty">
            Finding this month's stories…
        </div>

    </section>

</main>


<footer>
    GITAM · Campus Chronicle
</footer>


<script>

/* =========================================================
   DETECT CURRENT MONTH FOLDER
   ========================================================= */

const pathParts = window.location.pathname
    .split('/')
    .filter(Boolean);

const owner = window.location.hostname.split('.')[0];

const repo = pathParts[0];


/*
    Works for:

    /Campus-LIfe/August/
    /Campus-LIfe/August/index.html
*/

let monthFolder;

const lastPart =
    pathParts[pathParts.length - 1];

if (
    lastPart &&
    lastPart.toLowerCase() === 'index.html'
) {
    monthFolder =
        pathParts[pathParts.length - 2];
} else {
    monthFolder =
        pathParts[pathParts.length - 1];
}


/* =========================================================
   DISPLAY MONTH
   ========================================================= */

const monthTitle =
    document.getElementById('monthTitle');

monthTitle.textContent =
    monthFolder || 'Month';


/* =========================================================
   ELEMENTS
   ========================================================= */

const box =
    document.getElementById('events');

const count =
    document.getElementById('count');


/* =========================================================
   HELPERS
   ========================================================= */

function prettyName(filename){

    return filename
        .replace(/\.html$/i,'')
        .replace(/[-_]+/g,' ')
        .replace(/\b\w/g,c => c.toUpperCase());

}


function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,
        c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#039;'
        }[c])
    );

}


/* =========================================================
   GET EVENT DATE FROM EVENT HTML
   ========================================================= */

async function getEventDate(file){

    try{

        const response =
            await fetch(file.download_url);

        if(!response.ok){
            return null;
        }

        const html =
            await response.text();

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                html,
                'text/html'
            );


        /*
            Event HTML should contain:

            <meta
                name="event-date"
                content="2026-08-27"
            >
        */

        const dateMeta =
            doc.querySelector(
                'meta[name="event-date"]'
            );


        if(
            !dateMeta ||
            !dateMeta.content
        ){
            return null;
        }


        const date =
            new Date(dateMeta.content);


        if(isNaN(date)){
            return null;
        }


        return date;

    }

    catch(error){

        console.error(
            `Could not read date for ${file.name}`,
            error
        );

        return null;

    }

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(date){

    return date.toLocaleDateString(
        'en-IN',
        {
            day:'numeric',
            month:'long',
            year:'numeric'
        }
    );

}


/* =========================================================
   LOAD EVENTS
   ========================================================= */

async function load(){

    try{

        /*
            Ask GitHub for everything
            inside the current month folder.
        */

        const response =
            await fetch(
                `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(monthFolder)}`
            );


        if(!response.ok){

            throw new Error(
                `GitHub API error: ${response.status}`
            );

        }


        const files =
            await response.json();


        /*
            Keep only HTML event files.

            Ignore:
            - index.html
            - folders
            - photos/
        */

        const events =
            files.filter(file =>
                file.type === 'file' &&
                /\.html$/i.test(file.name) &&
                file.name.toLowerCase() !== 'index.html'
            );


        if(!events.length){

            box.innerHTML = `
                <div class="empty">
                    No event stories have been added
                    to this month yet.
                </div>
            `;

            count.textContent =
                '0 stories';

            return;

        }


        /*
            Read the event-date metadata
            from every event HTML.
        */

        const datedEvents =
            await Promise.all(
                events.map(async file => {

                    const date =
                        await getEventDate(file);

                    return {
                        file,
                        date
                    };

                })
            );


        /*
            Sort chronologically.

            Events without a date
            go to the bottom.
        */

        datedEvents.sort((a,b) => {

            if(!a.date && !b.date){
                return a.file.name
                    .localeCompare(b.file.name);
            }

            if(!a.date){
                return 1;
            }

            if(!b.date){
                return -1;
            }

            return a.date - b.date;

        });


        /* =================================================
           UPDATE COUNT
           ================================================= */

        count.textContent =
            `${datedEvents.length} ${
                datedEvents.length === 1
                    ? 'story'
                    : 'stories'
            }`;


        /* =================================================
           BUILD EVENT CARDS
           ================================================= */

        box.innerHTML = '';


        datedEvents.forEach((item,index) => {

            const file =
                item.file;

            const date =
                item.date;


            const card =
                document.createElement('a');

            card.className =
                'card';

            card.href =
                file.name;


            const dateHTML =
                date
                    ? `<div class="date">
                         ${formatDate(date)}
                       </div>`
                    : `<div class="date">
                         Date unavailable
                       </div>`;


            card.innerHTML = `

                <div class="number">
                    ${String(index + 1).padStart(2,'0')}
                </div>

                ${dateHTML}

                <div class="title">
                    ${escapeHTML(
                        prettyName(file.name)
                    )}
                </div>

                <div class="open">
                    Read story →
                </div>

            `;


            box.appendChild(card);

        });

    }


    catch(error){

        console.error(error);


        count.textContent =
            'Unavailable';


        box.innerHTML = `

            <div class="error">

                Unable to load the stories automatically.

                <br><br>

                Make sure this GitHub repository is
                public and GitHub Pages is enabled.

            </div>

        `;

    }

}


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>
</html>
